services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sk_beringis_app
    restart: unless-stopped
    ports:
      - '3333:3333'
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3333
      - LOG_LEVEL=info
      - SESSION_DRIVER=cookie
      - APP_KEY=${APP_KEY:-4-rnVomwK9BiZHfwfHDQeZXzC-CJH6e_}
      - APP_URL=${APP_URL:-http://localhost:3333}
      - DB_CONNECTION=pg
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-adonis}
      - DB_PASSWORD=${DB_PASSWORD:-secretpassword}
      - DB_DATABASE=${DB_DATABASE:-sk_beringis_db}
    volumes:
      - app_tmp:/app/tmp
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: sk_beringis_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-adonis}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secretpassword}
      POSTGRES_DB: ${DB_DATABASE:-sk_beringis_db}
    ports:
      - '${DB_PORT:-5434}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-adonis} -d ${DB_DATABASE:-sk_beringis_db}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
  app_tmp:
    driver: local