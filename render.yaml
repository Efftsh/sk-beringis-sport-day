services:
  - type: web
    name: sk-beringis-portal
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3333
      - key: HOST
        value: 0.0.0.0
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pg
      - key: DB_SSL
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: sk-beringis-db
          property: connectionString

databases:
  - name: sk-beringis-db
    plan: free
    databaseName: sk_beringis_db
    user: adonis
